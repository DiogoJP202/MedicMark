<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Checklist de Plantão — apresentação</title>

    <!-- Mesma folha de estilo do aplicativo real, copiada sem alteração. Nada vem de CDN. -->
    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/apresentacao.css" />
</head>
<body>
    <div class="app-shell">
        <header class="app-topo">
            <h1 class="app-topo__titulo" id="topo-titulo">Oeste</h1>
            <button type="button" class="distintivo distintivo--sucesso" id="indicador-sync" title="Sincronizado com o servidor">
                <span aria-hidden="true">●</span>
                <span id="indicador-sync-texto">Tudo sincronizado</span>
            </button>
        </header>

        <nav class="nav-principal" aria-label="Navegação principal" id="nav"></nav>

        <div id="faixa-notificacoes"></div>

        <main class="app-conteudo" id="conteudo"></main>
    </div>

    <div id="toast"></div>

    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
