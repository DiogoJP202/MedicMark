# Execução do servidor em Docker.
#   cp deploy/.env.example deploy/.env   (e preencha os valores)
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  servidor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: checklistplantao-server:latest
    container_name: checklistplantao-servidor
    restart: unless-stopped

    # Somente o Nginx do host alcança o Kestrel. Os aparelhos nunca acessam 8080 diretamente.
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${ALLOWED_HOSTS:-163.176.119.139}
      Database__Path: /data/checklistplantao.db
      Database__EnableWriteAheadLogging: "true"

      # Segredos vêm do .env, que NÃO é versionado.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY no arquivo .env}
      Jwt__Issuer: ${JWT_ISSUER:-ChecklistPlantao}
      Jwt__Audience: ${JWT_AUDIENCE:-ChecklistPlantao.Client}

      # Só têm efeito na PRIMEIRA execução, quando ainda não há nenhum usuário.
      Bootstrap__AdminUserName: ${ADMIN_USERNAME:-}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:-}
      Bootstrap__AdminDisplayName: ${ADMIN_DISPLAYNAME:-Administrador}
      Privacy__SupportUrl: ${PRIVACY_SUPPORT_URL:-https://github.com/DiogoJP202/MedicMark/issues}

    volumes:
      # Volume nomeado: o banco sobrevive a recriações do contêiner.
      # NUNCA aponte para /tmp.
      - dados:/data
      # As chaves do ASP.NET também precisam sobreviver à recriação do contêiner.
      # O diretório é criado com UID 10001 no host antes da primeira subida.
      - ./data-protection:/home/checklist/.aspnet/DataProtection-Keys

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dados:
    name: checklistplantao-dados
