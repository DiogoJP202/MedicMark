# Execução do servidor em Docker.
#   cp deploy/.env.example deploy/.env   (e preencha os valores)
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  servidor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: checklistplantao-server:latest
    container_name: checklistplantao-servidor
    restart: unless-stopped

    # 0.0.0.0 de propósito: os aparelhos do plantão acessam pela rede local.
    # Restrinja com firewall ou com um IP específico se a rede não for confiável.
    ports:
      - "${SERVER_PORT:-8080}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Path: /data/checklistplantao.db
      Database__EnableWriteAheadLogging: "true"

      # Segredos vêm do .env, que NÃO é versionado.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY no arquivo .env}
      Jwt__Issuer: ${JWT_ISSUER:-ChecklistPlantao}
      Jwt__Audience: ${JWT_AUDIENCE:-ChecklistPlantao.Client}

      # Só têm efeito na PRIMEIRA execução, quando ainda não há nenhum usuário.
      Bootstrap__AdminUserName: ${ADMIN_USERNAME:-}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:-}
      Bootstrap__AdminDisplayName: ${ADMIN_DISPLAYNAME:-Administrador}

    volumes:
      # Volume nomeado: o banco sobrevive a recriações do contêiner.
      # NUNCA aponte para /tmp.
      - dados:/data

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dados:
    name: checklistplantao-dados
