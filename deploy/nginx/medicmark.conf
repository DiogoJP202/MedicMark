map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Nunca registra a query string. O SignalR transporta o access token nela durante o upgrade para
# WebSocket; usar $request ou $request_uri colocaria a credencial no access.log.
log_format medicmark '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 163.176.119.139;
    access_log /var/log/nginx/access.log medicmark;

    if ($host != "163.176.119.139") {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://163.176.119.139$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 163.176.119.139;
    access_log /var/log/nginx/access.log medicmark;

    if ($host != "163.176.119.139") {
        return 444;
    }

    ssl_certificate /etc/letsencrypt/live/163.176.119.139/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/163.176.119.139/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
