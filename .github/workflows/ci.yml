# Integração contínua do ChecklistPlantão.
#
# Existe porque os testes só rodavam quando alguém lembrava. O projeto inteiro se apoia em não
# afirmar o que não foi medido — medir automaticamente é a continuação natural disso.
#
# Dois jobs, por um motivo concreto: a solução completa inclui os heads MAUI, que só compilam no
# Windows. Separar mantém o retorno rápido (testes em minutos no Linux) sem abrir mão de provar
# que Android e Windows continuam compilando.

name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Um push novo cancela a execução anterior do mesmo ramo: ninguém precisa do resultado de um
  # commit que já foi substituído.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # A versão vem do global.json, que fixa 10.0.201 — o mesmo SDK da máquina de desenvolvimento.
      - name: Instalar o .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore ChecklistPlantao.NoMaui.slnf

      # Release e não Debug: é em Release que TreatWarningsAsErrors está ligado. Um aviso novo
      # falha aqui, que é exatamente o ponto.
      - name: Compilar
        run: dotnet build ChecklistPlantao.NoMaui.slnf -c Release --no-restore

      - name: Testar
        run: >
          dotnet test ChecklistPlantao.NoMaui.slnf -c Release --no-build
          --logger "trx;LogFileName=resultados.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./resultados

      - name: Publicar resultados e cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultados-e-cobertura
          path: ./resultados
          retention-days: 14

  heads-maui:
    name: Compilar Android e Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Instalar o .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      # Os heads MAUI exigem as workloads; sem isto o build falha na restauração.
      - name: Instalar as workloads MAUI
        run: dotnet workload install maui-android maui-windows

      - name: Compilar a solução completa
        run: dotnet build ChecklistPlantao.sln -c Release

  dependencias:
    name: Revisar dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Recusar dependências vulneráveis novas
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
